<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e2552b">
<title>Leitor de Nota</title>
<style>
:root{
  --bg:#f5f3ef;--card:#fff;--ink:#1c1b1a;--muted:#6d6a66;--line:#e7e3dd;--soft:#f0ece6;
  --accent:#e2552b;--accent-ink:#fff;--accent-soft:#fbe7df;
  --ok:#1e8a5a;--ok-soft:#e1f3ea;--warn:#9a6412;--warn-soft:#fbf0d9;--bad:#c53030;--bad-soft:#fbe3e3;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212;--card:#1c1c1c;--ink:#f2f0ed;--muted:#a19d98;--line:#2c2b29;--soft:#252422;
  --accent:#ff6b3d;--accent-soft:#3a2219;--ok:#4cc38a;--ok-soft:#163327;--warn:#e0a84a;--warn-soft:#3a2d14;--bad:#f07272;--bad-soft:#3d1a1a;--shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.top i{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.top a.voltar{flex:none;width:30px;height:30px;border-radius:9px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;text-decoration:none;color:var(--ink);font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.btns{display:grid;gap:8px;margin-top:12px}
.row{display:flex;gap:8px}
.row>*{flex:1}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}

/* abas */
.abas{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:14px}
.abas a{flex:1;text-align:center;padding:9px 6px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
.abas a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* câmera */
#leitor{border-radius:var(--radius);overflow:hidden;background:#000;aspect-ratio:1/1;position:relative}
#leitor video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mira{position:absolute;left:50%;top:50%;width:75%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.mira.barras{width:90%;aspect-ratio:auto;height:40%}
#leitor-msg{position:absolute;inset:0;display:grid;place-items:center;color:#ddd;text-align:center;padding:24px;font-size:14px}
.dica{margin:12px 0 4px;text-align:center}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}

/* marcar a área da chave */
.passos{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.passos .num{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}
#area{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
#area canvas{display:block;max-width:100%;max-height:62vh;margin:auto;cursor:crosshair}
.lendo{display:flex;align-items:center;gap:10px;margin-top:12px}
.lendo .spin{width:20px;height:20px;border-width:3px}

/* chave */
.chave-in{display:block;resize:none;font:600 17px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;text-align:center;padding:14px 10px}
.status{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.neutro{background:var(--soft);color:var(--muted)}
.recorte{display:block;max-width:100%;border-radius:8px;border:1px solid var(--line);margin:0 auto 12px;background:#fff}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}

/* nota */
.carregando{display:grid;place-items:center;gap:14px;padding:64px 16px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.erro{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.aviso{background:var(--soft);border-color:transparent;font-size:14px}
.resumo .loja{font-size:18px;font-weight:700;line-height:1.25}
.resumo .total{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.resumo .total b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dados{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font-size:14px}
.dados dt{color:var(--muted)} .dados dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.itens{list-style:none;margin:0;padding:0}
.itens li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.itens li:first-child{border-top:0}
.itens .n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--muted);font-size:12px;font-weight:600;display:grid;place-items:center}
.itens .d{flex:1;min-width:0}
.itens .nome{font-weight:600;overflow-wrap:anywhere}
.itens .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.itens .q{font-variant-numeric:tabular-nums}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.sec h2{font-size:15px;margin:0}
.fixo{position:sticky;bottom:0;padding:12px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:90vw;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<input id="foto" type="file" accept="image/*" capture="environment" hidden>

<script>
(function () {
'use strict';
const ZXING_JS = 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js';
const ZXING_WASM = 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/reader/zxing_reader.wasm';
const TESSERACT_JS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const CHAVE_DEMO = '35261012345678000195550010000456781123456787';
const UFS = {11:1,12:1,13:1,14:1,15:1,16:1,17:1,21:1,22:1,23:1,24:1,25:1,26:1,27:1,28:1,29:1,31:1,32:1,33:1,35:1,41:1,42:1,43:1,50:1,51:1,52:1,53:1};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = n => n == null ? '—' : Number(n).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
const qtd = n => Number(n).toLocaleString('pt-BR', {maximumFractionDigits: 3});
const grupos = c => c.replace(/(.{4})(?=.)/g, '$1 ');
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2600); };

let foto = null;      // canvas com a foto tirada (para marcar a área)
let lida = null;      // {chave, ok, recorte} resultado da leitura da foto

/* ---------- chave de acesso: 44 caracteres, DV módulo 11 ---------- */
// Desde 2026 o CNPJ (posições 7–20) pode ter letras; no DV cada caractere vale (ASCII − 48).
function dvChave(base43) {
  let soma = 0, peso = 2;
  for (let i = base43.length - 1; i >= 0; i--) { soma += (base43.charCodeAt(i) - 48) * peso; peso = peso === 9 ? 2 : peso + 1; }
  const r = soma % 11; return r < 2 ? 0 : 11 - r;
}
const limparChave = s => String(s || '').toUpperCase().replace(/[^0-9A-Z]/g, '');
// Além do DV da chave, confere o CNPJ (ou CPF) do emitente, o mês e o modelo:
// assim um número lido errado quase nunca passa como chave válida.
function chaveValida(c) {
  if (!/^\d{6}[0-9A-Z]{12}\d{26}$/.test(c) || !UFS[c.slice(0, 2)] || dvChave(c.slice(0, 43)) !== +c[43]) return false;
  const mes = +c.slice(4, 6), doc = c.slice(6, 20);
  return mes >= 1 && mes <= 12 && /^(55|65)$/.test(c.slice(20, 22)) && (cnpjValido(doc) || (doc.startsWith('000') && cpfValido(doc.slice(3))));
}
// CNPJ (numérico ou alfanumérico): DVs módulo 11 com pesos 2–9 da direita para a esquerda.
function cnpjValido(d) {
  const dv = b => { let s = 0, p = 2; for (let i = b.length - 1; i >= 0; i--) { s += (b.charCodeAt(i) - 48) * p; p = p === 9 ? 2 : p + 1; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(d.slice(0, 12)) === +d[12] && dv(d.slice(0, 13)) === +d[13];
}
function cpfValido(d) {
  if (!/^\d{11}$/.test(d) || /^(\d)\1+$/.test(d)) return false;
  const dv = b => { let s = 0; for (let i = 0; i < b.length; i++) s += +b[i] * (b.length + 1 - i); const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dv(d.slice(0, 9)) === +d[9] && dv(d.slice(0, 10)) === +d[10];
}
// Chaves válidas que aparecem no texto lido: linhas com exatamente 44 dígitos e, como reserva,
// trechos de 44 dígitos seguidos (quando o OCR quebra a linha no meio).
function chavesNoTexto(texto) {
  const linhas = texto.split('\n').map(l => l.replace(/\D/g, '')).filter(Boolean);
  const achadas = new Set(), juntas = linhas.join('');
  for (const d of linhas) if (d.length === 44 && chaveValida(d)) achadas.add(d);
  for (let i = 0; i + 44 <= juntas.length; i++) if (chaveValida(juntas.slice(i, i + 44))) achadas.add(juntas.slice(i, i + 44));
  // Linha mais parecida com uma chave, para a pessoa corrigir se nada for válido.
  const parecida = linhas.slice().sort((a, b) => Math.abs(a.length - 44) - Math.abs(b.length - 44))[0] || '';
  return {achadas: [...achadas], parecida};
}

/* ---------- rotas ----------
   #/            câmera para cupom (QR Code)
   #/nfe         nota de distribuidor: código de barras, foto ou digitar
   #/nfe/foto    marcar a área da chave na foto
   #/nfe/chave   conferir / digitar a chave
   #/nota?url=   resultado do cupom
   #/chave?c=    resultado da NF-e */
async function route() {
  await pararCamera();
  const h = location.hash.replace(/^#\/?/, '');
  const [caminho, q] = h.split('?');
  const qs = new URLSearchParams(q || '');
  if (caminho === 'nota') return qs.get('url') ? telaNota(qs.get('url')) : (location.hash = '#/');
  if (caminho === 'chave') return qs.get('c') ? telaChave(qs.get('c')) : (location.hash = '#/nfe');
  if (caminho === 'nfe/foto') return foto ? telaMarcar() : (location.hash = '#/nfe');
  if (caminho === 'nfe/chave') return telaDigitar();
  telaCamera(caminho === 'nfe' ? 'nfe' : 'cupom');
}
const abrirNota = url => { location.hash = '#/nota?url=' + encodeURIComponent(url); };
const abrirChave = c => { location.hash = '#/chave?c=' + c; };

// Serve para as duas abas: QR Code com link → cupom; código de barras com 44 dígitos → NF-e.
function aoLer(texto) {
  if (/^https?:\/\//i.test(texto)) { vibrar(); abrirNota(texto); return true; }
  const c = limparChave(texto);
  if (c.length === 44 && chaveValida(c)) { vibrar(); abrirChave(c); return true; }
  return false;
}
const vibrar = () => navigator.vibrate && navigator.vibrate(80);

/* ---------- Tela 1: câmera (com abas) ---------- */
function telaCamera(aba) {
  const nfe = aba === 'nfe';
  $('#app').innerHTML = `
    <div class="top"><i>N</i><div><h1>Ler nota fiscal</h1><div class="muted small">${nfe ? 'Aponte para o código de barras da nota' : 'Aponte para o QR Code do cupom'}</div></div></div>
    <nav class="abas"><a href="#/" class="${nfe ? '' : 'on'}">Cupom fiscal</a><a href="#/nfe" class="${nfe ? 'on' : ''}">Nota de distribuidor</a></nav>
    <div id="leitor"><div class="mira${nfe ? ' barras' : ''}"></div><div id="leitor-msg">Abrindo a câmera…</div></div>
    ${nfe ? `
      <p class="dica muted small">O código de barras fica no topo da nota (DANFE), à direita. Se não ler, tire uma foto <b>de perto</b> dessa parte da nota.</p>
      <div class="btns">
        <label for="foto" class="btn pri full">Tirar foto e marcar a chave</label>
        <a href="#/nfe/chave" class="btn full">Digitar os 44 números</a>
        <button id="demo" class="btn full">Ver nota de exemplo</button>
      </div>` : `
      <p class="dica muted small">O QR Code fica no rodapé do cupom (NFC-e). Segure o celular parado, a uns 15 cm.</p>
      <details>
        <summary>Não consegue usar a câmera?</summary>
        <form id="manual" class="card" style="margin-top:8px">
          <label class="small muted" for="link">Cole o link do QR Code</label>
          <input id="link" type="url" inputmode="url" placeholder="https://www.nfce.fazenda…" required style="margin:6px 0 10px">
          <button class="btn pri full">Consultar nota</button>
        </form>
      </details>
      <div class="btns"><button id="demo" class="btn full">Ver nota de exemplo</button></div>`}`;
  if (nfe) {
    $('#demo').onclick = () => abrirChave(CHAVE_DEMO);
  } else {
    $('#manual').onsubmit = e => { e.preventDefault(); abrirNota($('#link').value.trim()); };
    $('#demo').onclick = () => abrirNota('demo');
  }
  iniciarCamera(nfe);
}

/* ---------- Leitura de códigos (QR Code e código de barras) ----------
   Usa o leitor nativo do navegador quando existe (Chrome no Android) e, se não, o zxing-wasm
   (iPhone e computador). O zxing é baixado só quando precisa. */
let zxing = null, detector;
function carregarZxing() {
  if (!zxing) {
    zxing = carregarScript(ZXING_JS).then(() => {
      ZXingWASM.prepareZXingModule({overrides: {locateFile: (arq, pasta) => arq.endsWith('.wasm') ? ZXING_WASM : pasta + arq}});
      return window.ZXingWASM;
    });
    zxing.catch(() => { zxing = null; });
  }
  return zxing;
}
async function detectorNativo() {
  if (detector !== undefined) return detector;
  detector = null;
  try {
    const f = 'BarcodeDetector' in window ? await BarcodeDetector.getSupportedFormats() : [];
    if (f.includes('code_128') && f.includes('qr_code')) detector = new BarcodeDetector({formats: ['code_128', 'qr_code']});
  } catch (e) {}
  return detector;
}
// Textos dos códigos achados no canvas. Com "forte" (fotos), tenta o zxing também quando o nativo não acha.
async function lerCodigos(canvas, forte) {
  const d = await detectorNativo();
  if (d) {
    try { const r = await d.detect(canvas); if (r.length || !forte) return r.map(x => x.rawValue); } catch (e) {}
  }
  const z = await carregarZxing().catch(() => null);
  if (!z) return [];
  const img = canvas.getContext('2d', {willReadFrequently: true}).getImageData(0, 0, canvas.width, canvas.height);
  return (await z.readBarcodes(img, {formats: ['Code128', 'QRCode'], tryHarder: true, maxNumberOfSymbols: 1})).map(x => x.text);
}
const codigoUtil = t => /^https?:\/\//i.test(t) || chaveValida(limparChave(t));

// Copia um pedaço da imagem para um canvas novo, com a largura pedida (amplia ou reduz).
function recorte(origem, x, y, w, h, largura) {
  const k = largura / w, c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const cx = c.getContext('2d', {willReadFrequently: true});
  cx.imageSmoothingQuality = 'high';
  cx.drawImage(origem, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

// Procura um código na foto (ou só na área indicada). As barras de uma DANFE são finas: se ficarem
// com menos de ~2 px na foto, o leitor não acha. Por isso amplia: a foto inteira e depois por partes.
async function codigoNaFoto(img, area) {
  const partes = [];
  if (area) partes.push(area);
  else {
    partes.push({x: 0, y: 0, w: img.width, h: img.height});
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) partes.push({x: j * img.width / 4, y: i * img.height / 4, w: img.width / 2, h: img.height / 2});
  }
  for (const a of partes) {
    const x = Math.max(0, a.x), y = Math.max(0, a.y), w = Math.min(img.width - x, a.w), h = Math.min(img.height - y, a.h);
    if (w < 20 || h < 20) continue;
    try {
      for (const t of await lerCodigos(recorte(img, x, y, w, h, Math.min(3000, Math.max(w, Math.min(w * 2, 2400)))), true))
        if (codigoUtil(t)) return t;
    } catch (e) {}
  }
  return null;
}

/* ---------- Câmera ao vivo ---------- */
let camera = null;
async function iniciarCamera(nfe) {
  const msg = t => { const m = $('#leitor-msg'); if (m) m.textContent = t; };
  if (!window.isSecureContext || !navigator.mediaDevices) return msg('A câmera só funciona com https:// (ou em localhost).');
  const eu = camera = {parado: false};
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
  } catch (e) {
    if (camera === eu) msg('Sem acesso à câmera. Libere a permissão no navegador' + (nfe ? ', tire uma foto ou digite a chave.' : ' ou cole o link abaixo.'));
    return;
  }
  if (eu.parado) { stream.getTracks().forEach(t => t.stop()); return; }
  eu.stream = stream;
  const video = document.createElement('video');
  video.setAttribute('playsinline', ''); video.muted = true; video.srcObject = stream;
  $('#leitor').prepend(video);
  try { await video.play(); } catch (e) {}
  msg('');
  if (!(await detectorNativo())) carregarZxing().catch(() => msg('Não foi possível carregar o leitor. Verifique a internet.'));

  // Lê só o meio da imagem (onde fica a mira): faixa larga para código de barras, quadrado para QR Code.
  const ciclo = async () => {
    if (eu.parado) return;
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw) {
      const w = nfe ? vw * 0.9 : Math.min(vw, vh) * 0.8, h = nfe ? Math.min(vh, w * 0.5) : w;
      try {
        for (const t of await lerCodigos(recorte(video, (vw - w) / 2, (vh - h) / 2, w, h, w), false))
          if (!eu.parado && aoLer(t)) { pararCamera(); return; }
      } catch (e) {}
    }
    if (!eu.parado) eu.timer = setTimeout(ciclo, 150);
  };
  ciclo();
}

function pararCamera() {
  const c = camera; camera = null;
  if (c) { c.parado = true; clearTimeout(c.timer); if (c.stream) c.stream.getTracks().forEach(t => t.stop()); }
  return Promise.resolve();
}

/* ---------- Foto: tentar o código de barras, senão marcar a área ---------- */
$('#foto').onchange = async e => {
  const arq = e.target.files[0]; if (!arq) return;
  e.target.value = ''; // permite escolher a mesma foto de novo
  await pararCamera();
  try { foto = await carregarImagem(arq); } catch (err) { return toast('Não consegui abrir a foto. Tente de novo.'); }
  // 1º: se o código de barras for legível na foto, nem precisa marcar nada.
  carregando('Procurando o código de barras na foto');
  const cod = await codigoNaFoto(foto);
  if (cod && aoLer(cod)) { toast('Código de barras lido na foto'); return; }
  if (location.hash === '#/nfe/foto') route(); // já estava nessa tela (tirou outra foto)
  else location.hash = '#/nfe/foto';
};

// Desenha a foto num canvas, reduzida para no máximo 3000 px no lado maior (economiza memória).
function carregarImagem(arq) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arq);
    img.onload = () => {
      const k = Math.min(1, 3000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(); };
    img.src = url;
  });
}

/* ---------- Tela: marcar a área dos 44 números ---------- */
// A seleção fica guardada em pixels da foto. "vista" é o pedaço da foto que aparece na tela:
// começa com a foto inteira e, depois de uma marcação pequena, aproxima nela para ajustar.
function telaMarcar() {
  $('#app').innerHTML = `
    <div class="top"><a href="#/nfe" class="voltar" aria-label="Voltar">‹</a><div><h1>Marque a chave</h1><div class="muted small">Os 44 números embaixo de “CHAVE DE ACESSO”</div></div></div>
    <div class="passos"><span class="num">1</span><div class="small">Encontre a <b>chave de acesso</b> no topo da nota, à direita (fica embaixo do código de barras).</div></div>
    <div class="passos"><span class="num">2</span><div class="small" id="instrucao"><b>Arraste o dedo</b> por cima <b>só da linha dos números</b>, de um canto ao outro, formando um retângulo.</div></div>
    <div id="area"><canvas id="tela"></canvas></div>
    <button id="inteira" class="btn full" style="margin-top:8px" hidden>Ver a foto inteira</button>
    <div id="lendo"></div>
    <div class="row" style="margin-top:12px">
      <label id="outra" for="foto" class="btn">Outra foto</label>
      <button id="ler" class="btn pri" disabled>Ler números</button>
    </div>`;
  const tela = $('#tela'), ctx = tela.getContext('2d');
  let sel = null, inicio = null, vista, k;

  const mostrar = v => {
    vista = v; k = Math.min(1600, Math.max(900, v.w)) / v.w;
    tela.width = Math.round(v.w * k); tela.height = Math.round(v.h * k);
    $('#inteira').hidden = v.w === foto.width && v.h === foto.height;
    desenhar();
  };
  const desenhar = () => {
    ctx.drawImage(foto, vista.x, vista.y, vista.w, vista.h, 0, 0, tela.width, tela.height);
    if (!sel) return;
    const s = norm(sel), r = {x: (s.x - vista.x) * k, y: (s.y - vista.y) * k, w: s.w * k, h: s.h * k};
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(0, 0, tela.width, r.y); ctx.fillRect(0, r.y + r.h, tela.width, tela.height - r.y - r.h);
    ctx.fillRect(0, r.y, r.x, r.h); ctx.fillRect(r.x + r.w, r.y, tela.width - r.x - r.w, r.h);
    ctx.strokeStyle = '#ff6b3d'; ctx.lineWidth = Math.max(3, tela.width / 250); ctx.strokeRect(r.x, r.y, r.w, r.h);
  };
  const norm = s => ({x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1)});
  // Converte a posição do dedo na tela para pixels da foto.
  const ponto = e => {
    const b = tela.getBoundingClientRect();
    const x = vista.x + (e.clientX - b.left) / b.width * vista.w, y = vista.y + (e.clientY - b.top) / b.height * vista.h;
    return {x: Math.max(vista.x, Math.min(vista.x + vista.w, x)), y: Math.max(vista.y, Math.min(vista.y + vista.h, y))};
  };
  tela.onpointerdown = e => { tela.setPointerCapture(e.pointerId); inicio = ponto(e); sel = {x1: inicio.x, y1: inicio.y, x2: inicio.x, y2: inicio.y}; desenhar(); };
  tela.onpointermove = e => { if (!inicio) return; const p = ponto(e); sel.x2 = p.x; sel.y2 = p.y; desenhar(); };
  tela.onpointerup = tela.onpointercancel = () => {
    inicio = null;
    const r = sel && norm(sel);
    if (!r || r.w < vista.w * 0.05 || r.h * k < 4) { sel = null; desenhar(); $('#ler').disabled = true; return; }
    $('#ler').disabled = false;
    // Marcação pequena na tela: aproxima nela (com folga) para a pessoa conferir e ajustar.
    if (r.w < vista.w * 0.5) {
      const w = Math.min(foto.width, r.w * 1.4), h = Math.min(foto.height, Math.max(r.h * 3, w / 3));
      const x = Math.max(0, Math.min(foto.width - w, r.x + r.w / 2 - w / 2)), y = Math.max(0, Math.min(foto.height - h, r.y + r.h / 2 - h / 2));
      mostrar({x, y, w, h});
      $('#instrucao').innerHTML = 'Aproximei. Se o retângulo não cobrir <b>todos os 44 números</b>, arraste de novo. Depois toque em <b>Ler números</b>.';
    }
  };
  $('#inteira').onclick = () => mostrar({x: 0, y: 0, w: foto.width, h: foto.height});
  mostrar({x: 0, y: 0, w: foto.width, h: foto.height});

  $('#ler').onclick = async () => {
    $('#ler').disabled = true; $('#outra').style.cssText = 'pointer-events:none;opacity:.45';
    const aviso = t => { $('#lendo').innerHTML = `<div class="lendo"><div class="spin"></div><div class="small">${esc(t)}</div></div>`; };
    const m = norm(sel);
    aviso('Procurando o código de barras…');
    // Na DANFE o código de barras fica logo acima da chave: tenta lê-lo antes do OCR.
    const cod = await codigoNaFoto(foto, {x: m.x - m.w * 0.15, y: m.y - m.h * 6, w: m.w * 1.3, h: m.h * 7.5});
    if (cod && chaveValida(limparChave(cod))) {
      lida = {chave: limparChave(cod), ok: true, barras: true, recorte: recorte(foto, m.x, m.y, m.w, m.h, Math.min(1200, m.w * 2)).toDataURL('image/png')};
      location.hash = '#/nfe/chave';
      return;
    }
    try {
      lida = await Promise.race([
        lerChaveDaImagem(foto, norm(sel), aviso),
        new Promise((_, rej) => setTimeout(() => rej(new Error('tempo')), 90000)),
      ]);
    } catch (err) {
      lida = {chave: '', ok: false, erroLeitura: true};
    }
    location.hash = '#/nfe/chave';
  };
}

/* ---------- OCR dos números (Tesseract.js, carregado só quando precisa) ---------- */
let ocr = null, ocrAviso = () => {};
function carregarScript(src) {
  return new Promise((ok, falha) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = falha; document.head.append(s); });
}
async function workerOcr(aviso) {
  if (!ocr) {
    ocr = (async () => {
      if (!window.Tesseract) await carregarScript(TESSERACT_JS);
      // Erros dentro do worker (ex.: falha ao baixar o idioma) não rejeitam a promessa sozinhos.
      let falhou;
      const erro = new Promise((_, rej) => { falhou = rej; });
      return Promise.race([erro, Tesseract.createWorker('eng', 1, {
        logger: m => { if (m.status === 'recognizing text') ocrAviso('Lendo os números… ' + Math.round(m.progress * 100) + '%'); },
        errorHandler: e => falhou(e),
      })]);
    })();
    ocr.catch(() => { ocr = null; });
  }
  ocrAviso = aviso;
  aviso('Carregando o leitor de números (na primeira vez demora um pouco)…');
  return ocr;
}

async function lerChaveDaImagem(img, r, aviso) {
  // Recorta com uma folga e amplia para ~1400 px de largura (o Tesseract erra menos com texto grande).
  const pad = Math.round(Math.max(r.h * 0.15, 4));
  const x = Math.max(0, Math.round(r.x - pad)), y = Math.max(0, Math.round(r.y - pad));
  const w = Math.min(img.width - x, Math.round(r.w + pad * 2)), h = Math.min(img.height - y, Math.round(r.h + pad * 2));
  // Cada leitura erra em lugares diferentes (troca 0 por 9, junta grupos…). Por isso lê com várias
  // versões da imagem e só dá a chave como conferida quando 2 leituras chegam à mesma chave válida.
  const versoes = [], recortar = largura => {
    const k = Math.max(1, Math.min(4, largura / w));
    const c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, x, y, w, h, 0, 0, c.width, c.height);
    return c;
  };
  const p900 = recortar(900), p1400 = recortar(1400);
  for (const [base, bin, modo] of [[p900, false, '6'], [p1400, true, '6'], [p1400, false, '11'], [p900, true, '6'], [p1400, false, '6'], [p900, true, '11'], [p900, false, '11'], [p1400, true, '11']])
    versoes.push({c: filtrar(base, bin), modo});

  const worker = await workerOcr(aviso);
  const votos = new Map();
  let parecida = '';
  for (let i = 0; i < versoes.length; i++) {
    ocrAviso = t => aviso(t.replace('Lendo os números…', 'Lendo os números (' + (i + 1) + '/' + versoes.length + ')…'));
    await worker.setParameters({tessedit_char_whitelist: '0123456789', tessedit_pageseg_mode: versoes[i].modo});
    const r = chavesNoTexto((await worker.recognize(versoes[i].c)).data.text);
    for (const c of r.achadas) votos.set(c, (votos.get(c) || 0) + 1);
    if (Math.abs(r.parecida.length - 44) < Math.abs(parecida.length - 44)) parecida = r.parecida;
    const [melhor, n] = [...votos].sort((a, b) => b[1] - a[1])[0] || [];
    if (n >= 2) return {chave: melhor, ok: true, recorte: versoes[0].c.toDataURL('image/png')};
  }
  const [unica] = [...votos.keys()];
  const recorte = versoes[0].c.toDataURL('image/png');
  // Só uma leitura deu chave válida: mostra, mas pede para a pessoa comparar com a nota.
  if (votos.size === 1) return {chave: unica, ok: false, duvida: true, recorte};
  return {chave: parecida.slice(0, 44), ok: false, recorte};
}

// Tons de cinza e, se pedido, preto e branco com limiar automático (Otsu).
function filtrar(origem, binario) {
  const c = document.createElement('canvas'); c.width = origem.width; c.height = origem.height;
  const ctx = c.getContext('2d'); ctx.drawImage(origem, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data, hist = new Array(256).fill(0);
  for (let i = 0; i < px.length; i += 4) { const g = Math.round(px[i] * .299 + px[i + 1] * .587 + px[i + 2] * .114); px[i] = px[i + 1] = px[i + 2] = g; hist[g]++; }
  if (binario) {
    const total = px.length / 4; let soma = 0; for (let i = 0; i < 256; i++) soma += i * hist[i];
    let sB = 0, wB = 0, max = 0, limiar = 127;
    for (let t = 0; t < 256; t++) {
      wB += hist[t]; if (!wB) continue; const wF = total - wB; if (!wF) break;
      sB += t * hist[t]; const mB = sB / wB, mF = (soma - sB) / wF, v = wB * wF * (mB - mF) ** 2;
      if (v > max) { max = v; limiar = t; }
    }
    for (let i = 0; i < px.length; i += 4) px[i] = px[i + 1] = px[i + 2] = px[i] > limiar ? 255 : 0;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

/* ---------- Tela: conferir / digitar a chave ---------- */
function telaDigitar() {
  const r = lida; lida = null;
  const daFoto = !!r;
  $('#app').innerHTML = `
    <div class="top"><a href="#/nfe" class="voltar" aria-label="Voltar">‹</a><div><h1>${daFoto ? 'Confira a chave' : 'Digite a chave'}</h1><div class="muted small">${daFoto ? 'Compare com a nota antes de buscar' : 'Os 44 números embaixo de “CHAVE DE ACESSO”'}</div></div></div>
    <div class="card">
      ${daFoto && r.recorte ? `<img class="recorte" src="${r.recorte}" alt="Área marcada na foto">` : ''}
      <textarea id="chave" class="chave-in" rows="3" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="0000 0000 0000 0000 …">${esc(grupos(r ? r.chave : ''))}</textarea>
      <div id="status"></div>
      <button id="buscar" class="btn pri full" style="margin-top:12px" disabled>Buscar nota</button>
    </div>
    ${daFoto ? `<div class="row" style="margin-top:12px"><a href="#/nfe/foto" class="btn">Marcar de novo</a><label for="foto" class="btn">Tirar outra foto</label></div>` : ''}`;

  const inp = $('#chave');
  const conferir = () => {
    const c = limparChave(inp.value).slice(0, 44);
    const fim = inp.selectionStart === inp.value.length;
    inp.value = grupos(c);
    if (fim) inp.setSelectionRange(inp.value.length, inp.value.length);
    const ok = c.length === 44 && chaveValida(c);
    let st;
    if (ok && daFoto && r.duvida && c === r.chave) st = `<div class="status warn">Li esta chave, mas não tenho certeza. <b>Compare com a nota</b> antes de buscar, ou marque de novo.</div>`;
    else if (ok) st = `<div class="status ok">✓ Chave conferida${daFoto && r.barras && c === r.chave ? ' (lida pelo código de barras)' : daFoto ? '. Confira se bate com a nota.' : ''}</div>`;
    else if (c.length === 44) st = `<div class="status bad">Essa chave não confere: algum número está errado. ${daFoto ? 'Corrija aqui, marque de novo ou tire outra foto mais de perto.' : 'Confira com a nota.'}</div>`;
    else if (daFoto && c.length === 0 && r.erroLeitura) st = `<div class="status bad">Não consegui carregar o leitor de números. Verifique a internet ou digite a chave.</div>`;
    else if (daFoto && !c.length) st = `<div class="status bad">Não encontrei números nessa área. Marque de novo, tire outra foto mais de perto ou digite.</div>`;
    else st = `<div class="status ${daFoto ? 'bad' : 'neutro'}">${daFoto ? 'Não consegui ler todos os números (' + c.length + ' de 44). Complete aqui, marque de novo ou tire outra foto.' : c.length + ' de 44 números'}</div>`;
    $('#status').innerHTML = st;
    $('#buscar').disabled = !ok;
    return ok ? c : '';
  };
  inp.oninput = conferir;
  $('#buscar').onclick = () => { const c = conferir(); if (c) abrirChave(c); };
  inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#buscar').click(); } };
  conferir();
  if (!daFoto) inp.focus();
}

/* ---------- Telas de resultado ---------- */
const carregando = t => { $('#app').innerHTML = `<div class="carregando"><div class="spin"></div><div><b>Carregando…</b><div class="muted small">${t}</div></div></div>`; };

async function consultar(rota, corpo) {
  try {
    const resp = await fetch(rota, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo)});
    return await resp.json();
  } catch (e) {
    return {ok: false, erro: 'Não foi possível falar com o servidor. Verifique a internet.'};
  }
}

function listaProdutos(r) {
  if (!r.produtos || !r.produtos.length) return '';
  return `
    <div class="sec"><h2>Produtos</h2><span class="muted small">${r.produtos.length} ${r.produtos.length === 1 ? 'item' : 'itens'}</span></div>
    <div class="card" style="padding:4px 16px">
      <ul class="itens">${r.produtos.map(p => `
        <li>
          <span class="n">${p.id}</span>
          <div class="d">
            <div class="nome">${esc(p.nome)}</div>
            <div class="muted small q">${qtd(p.quantidade)} ${esc(p.unidade)} × ${brl(p.preco_unitario)}</div>
          </div>
          <div class="v">${brl(p.preco_total)}</div>
        </li>`).join('')}
      </ul>
    </div>`;
}

async function telaNota(url) {
  carregando('Buscando os produtos da nota na SEFAZ');
  const r = await consultar('api/nfce', {url});
  if (!location.hash.startsWith('#/nota')) return; // saiu da tela enquanto carregava
  if (!r.ok) return telaErro(r.erro || 'Não foi possível ler esta nota.', () => telaNota(url), '#/');
  $('#app').innerHTML = `
    <div class="top"><i>N</i><h1>Sua nota</h1></div>
    <div class="card resumo">
      <div class="loja">${esc(r.estabelecimento)}</div>
      <div class="muted small">${[r.cnpj && 'CNPJ ' + esc(r.cnpj), r.data_emissao && esc(r.data_emissao)].filter(Boolean).join(' · ')}</div>
      <div class="total"><span class="muted">Total da nota</span><b>${brl(r.valor_total)}</b></div>
    </div>
    ${listaProdutos(r)}
    ${r.fonte === 'demo' ? '<p class="muted small" style="text-align:center">Esta é uma nota de exemplo.</p>' : ''}
    <div class="fixo"><a href="#/" class="btn pri full">Ler outra nota</a></div>`;
}

async function telaChave(c) {
  carregando('Consultando a nota fiscal');
  const r = await consultar('api/nfe', {chave: c});
  if (!location.hash.startsWith('#/chave')) return;
  if (!r.ok) return telaErro(r.erro || 'Não foi possível consultar esta nota.', () => telaChave(c), '#/nfe');
  const dados = [
    ['CNPJ do emitente', r.cnpj], ['Número / série', r.numero + ' / ' + r.serie],
    ['Emissão', r.data_emissao || r.mes_emissao], ['Estado', r.uf], ['Tipo', r.modelo],
  ].filter(d => d[1]);
  $('#app').innerHTML = `
    <div class="top"><i>N</i><h1>Nota de distribuidor</h1></div>
    <div class="card resumo">
      <div class="loja">${esc(r.estabelecimento || r.modelo + ' nº ' + r.numero)}</div>
      <dl class="dados">${dados.map(d => `<dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>`).join('')}</dl>
      ${r.valor_total != null ? `<div class="total"><span class="muted">Total da nota</span><b>${brl(r.valor_total)}</b></div>` : ''}
      <div class="muted small mono" style="margin-top:12px">${esc(grupos(r.chave))}</div>
      <button id="copiar" class="btn full" style="margin-top:10px">Copiar chave</button>
    </div>
    ${r.aviso ? `<div class="card aviso" style="margin-top:12px">${esc(r.aviso)}</div>` : ''}
    ${listaProdutos(r)}
    ${r.fonte === 'demo' ? '<p class="muted small" style="text-align:center">Esta é uma nota de exemplo.</p>' : ''}
    <div class="fixo"><a href="#/nfe" class="btn pri full">Ler outra nota</a></div>`;
  $('#copiar').onclick = () => navigator.clipboard.writeText(r.chave).then(() => toast('Chave copiada'), () => toast('Não deu para copiar'));
}

function telaErro(msg, tentar, voltar) {
  $('#app').innerHTML = `
    <div class="top"><i>N</i><h1>Não deu certo</h1></div>
    <div class="card erro">${esc(msg)}</div>
    <div class="row" style="margin-top:14px">
      <button id="denovo" class="btn">Tentar de novo</button>
      <a href="${voltar}" class="btn pri">Ler outra nota</a>
    </div>`;
  $('#denovo').onclick = tentar;
}

window.addEventListener('hashchange', route);
route();
})();
</script>
